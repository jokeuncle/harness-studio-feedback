name: 问题反馈
description: 报告操作异常、界面问题或与预期不符的行为
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助改进 Harness Studio。此处为公开反馈，请先搜索已有 Issue，并遮盖截图中的个人信息。
        请勿上传密码、密钥、Token、完整配置、账号恢复码或付款凭证；账号与付款问题请联系 827919619@qq.com。
  - type: input
    id: version
    attributes:
      label: Harness Studio 版本
      placeholder: 例如：0.1.0（帮助与支持中可查看）
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 系统版本与涉及的 AI 客户端
      placeholder: 例如：macOS 15，Codex；若无关可填写「无关」
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从进入哪个页面开始，按顺序描述操作，并说明是否每次都能出现。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      description: 你希望看到什么？
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与错误提示
      description: 请保留错误提示原文。可附脱敏截图，不要上传完整配置文件。
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 其他信息（可选）
      description: 是否有临时解决办法，或相关的已有 Issue？
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开内容确认
      options:
        - label: 我已检查文字与附件，未包含密码、密钥、Token、完整配置或其他敏感信息。
          required: true
